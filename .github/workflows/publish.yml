name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_tag="v$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "${package_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_tag}."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: npm publish --access public
